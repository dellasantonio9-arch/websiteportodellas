  <!-- Space Canvas Background Animation Engine -->
  <script>
    (function initCosmicBackground() {
      const canvas = document.getElementById('spaceCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width, height;
      let stars = [];
      let shootingStars = [];
      let mouse = { x: null, y: null, targetX: 0, targetY: 0 };

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      window.addEventListener('mousemove', (e) => {
        mouse.targetX = (e.clientX - width / 2) * 0.05;
        mouse.targetY = (e.clientY - height / 2) * 0.05;
      });

      // Generate 220 celestial stars
      const STAR_COUNT = 200;
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 2 + 0.5,
          alpha: Math.random() * 0.8 + 0.2,
          speed: Math.random() * 0.02 + 0.005,
          depth: Math.random() * 2 + 1,
          color: Math.random() > 0.35 ? '#93c5fd' : (Math.random() > 0.5 ? '#60a5fa' : '#ffffff')
        });
      }

      // Shooting star generator
      function createShootingStar() {
        const startX = Math.random() * width * 1.2 - width * 0.1;
        const startY = Math.random() * (height * 0.4);
        const length = Math.random() * 90 + 70;
        const speed = Math.random() * 12 + 10;
        const angle = Math.PI / 4 + (Math.random() * 0.2 - 0.1); // ~45 degrees

        shootingStars.push({
          x: startX,
          y: startY,
          length: length,
          speed: speed,
          dx: Math.cos(angle) * speed,
          dy: Math.sin(angle) * speed,
          alpha: 1,
          decay: Math.random() * 0.018 + 0.012
        });
      }

      // Spawn meteors periodically
      setInterval(() => {
        if (Math.random() > 0.3 && shootingStars.length < 3) {
          createShootingStar();
        }
      }, 3500);

      // Render loop
      function animate() {
        ctx.clearRect(0, 0, width, height);

        // Smooth mouse parallax
        mouse.x = (mouse.x || 0) + (mouse.targetX - (mouse.x || 0)) * 0.05;
        mouse.y = (mouse.y || 0) + (mouse.targetY - (mouse.y || 0)) * 0.05;

        // Draw stars
        stars.forEach(star => {
          star.alpha += Math.sin(Date.now() * star.speed) * 0.015;
          const currentAlpha = Math.max(0.15, Math.min(1, star.alpha));

          const px = star.x + (mouse.x * star.depth);
          const py = star.y + (mouse.y * star.depth);

          ctx.beginPath();
          ctx.arc(px, py, star.size, 0, Math.PI * 2);
          ctx.fillStyle = star.color;
          ctx.globalAlpha = currentAlpha;
          ctx.fill();

          // Star blue glow for larger stars
          if (star.size > 1.8) {
            ctx.beginPath();
            ctx.arc(px, py, star.size * 2.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(44, 103, 237, 0.3)';
            ctx.fill();
          }
        });

        // Draw shooting stars
        for (let i = shootingStars.length - 1; i >= 0; i--) {
          const s = shootingStars[i];
          ctx.save();
          ctx.globalAlpha = s.alpha;

          const grad = ctx.createLinearGradient(
            s.x, s.y,
            s.x - s.dx * (s.length / s.speed),
            s.y - s.dy * (s.length / s.speed)
          );
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.3, '#38bdf8');
          grad.addColorStop(0.7, '#2c67ed');
          grad.addColorStop(1, 'transparent');

          ctx.strokeStyle = grad;
          ctx.lineWidth = 2.2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(
            s.x - s.dx * (s.length / s.speed),
            s.y - s.dy * (s.length / s.speed)
          );
          ctx.stroke();

          // Glow head
          ctx.beginPath();
          ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#2c67ed';
          ctx.shadowBlur = 15;
          ctx.fill();

          ctx.restore();

          s.x += s.dx;
          s.y += s.dy;
          s.alpha -= s.decay;

          if (s.alpha <= 0 || s.x > width + 100 || s.y > height + 100) {
            shootingStars.splice(i, 1);
          }
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>

  <!-- Synthesizer for Cosmic Sound Effects (Zero External Audio File Dependency) -->
  <script>
    window.playCosmicSound = function(type = 'click') {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') ctx.resume();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(659.25, now); // E5
          osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.12); // C6
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'tab') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.18);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
          osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.start(now);
          osc.stop(now + 0.5);
        }
      } catch (e) {
        // Audio synthesis gracefully ignored if disabled
      }
    };
  </script>

      const [currentRoleIndex, setCurrentRoleIndex] = useState(0);
      const [displayedText, setDisplayedText] = useState("");
      const [isDeleting, setIsDeleting] = useState(false);
      const [typingSpeed, setTypingSpeed] = useState(120);

      useEffect(() => {
        const fullText = roles[currentRoleIndex];
        let timer;

        if (!isDeleting) {
          // Typing
          if (displayedText.length < fullText.length) {
            timer = setTimeout(() => {
              setDisplayedText(fullText.slice(0, displayedText.length + 1));
            }, typingSpeed);
          } else {
            // Pause at complete word
            timer = setTimeout(() => {
              setIsDeleting(true);
              setTypingSpeed(50);
            }, 2000);
          }
        } else {
          // Deleting
          if (displayedText.length > 0) {
            timer = setTimeout(() => {
              setDisplayedText(fullText.slice(0, displayedText.length - 1));
            }, typingSpeed);
          } else {
            setIsDeleting(false);
            setCurrentRoleIndex((prev) => (prev + 1) % roles.length);
            setTypingSpeed(120);
          }
        }

        return () => clearTimeout(timer);
      }, [displayedText, isDeleting, currentRoleIndex, roles, typingSpeed]);

              const height = el.offsetHeight;
              if (scrollPos >= top && scrollPos < top + height) {
                setActiveSection(s);
                break;
              }
            }
          }
        };

        window.addEventListener("scroll", handleScrollSpy);
        return () => window.removeEventListener("scroll", handleScrollSpy);
      }, []);

      return (
        <div className="min-h-screen">
          <FloatingNavbar activeSection={activeSection} />
          <HeroSection />
          <AboutSection />
          <PortfolioSection />
          <ContactSection />
          <Footer />
        </div>
      );
    };

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
